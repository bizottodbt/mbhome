---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-postgres
spec:
  instances: 2
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-config
  storage:
    storageClass: nfs-cache
    size: 10Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  monitoring:
    enablePodMonitor: false
