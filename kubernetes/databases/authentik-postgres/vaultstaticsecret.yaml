---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-config
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
spec:
  type: kv-v2
  vaultAuthRef: default
  mount: mbhome
  path: apps/authentik/config
  refreshAfter: 5m
  hmacSecretData: true
  destination:
    create: true
    name: authentik-config
    overwrite: true
