---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: finance
  namespace: flux-system
  labels:
    app.kubernetes.io/name: finance
    mbhome.biz/source: forgejo
spec:
  interval: 10m
  timeout: 5m
  prune: true
  wait: true
  suspend: false
  path: ./kubernetes
  targetNamespace: finance
  sourceRef:
    kind: GitRepository
    name: finance
  dependsOn:
    - name: apps
