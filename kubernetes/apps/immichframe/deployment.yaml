---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immichframe
  namespace: immichframe
  labels:
    app.kubernetes.io/name: immichframe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immichframe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immichframe
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              weather_api_key=""
              if [ -f /app/secrets/weather-api-key ]; then
                weather_api_key="$(cat /app/secrets/weather-api-key)"
              fi
              escaped_weather_api_key="$(printf '%s' "$weather_api_key" | sed 's/[\/&]/\\&/g')"
              sed "s/__WEATHER_API_KEY__/${escaped_weather_api_key}/g" /app/ConfigTemplate/Settings.yml > /app/Config/Settings.yml
          volumeMounts:
            - name: config-template
              mountPath: /app/ConfigTemplate
              readOnly: true
            - name: config
              mountPath: /app/Config
            - name: secrets
              mountPath: /app/secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: immichframe
          image: ghcr.io/immichframe/immichframe:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Stockholm
            - name: IMMICHFRAME_CONFIG_PATH
              value: /app/Config
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/Config
              readOnly: true
            - name: secrets
              mountPath: /app/secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: config-template
          configMap:
            name: immichframe-config
        - name: config
          emptyDir: {}
        - name: secrets
          secret:
            secretName: immichframe
