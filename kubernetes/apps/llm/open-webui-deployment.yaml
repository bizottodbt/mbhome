---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
  labels:
    app.kubernetes.io/name: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: open-webui
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-static-assets
          image: ghcr.io/open-webui/open-webui:v0.9.5
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              cp -R /app/backend/open_webui/static/. /static-assets/
          volumeMounts:
            - name: static-assets
              mountPath: /static-assets
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.9.5
          imagePullPolicy: IfNotPresent
          env:
            - name: WEBUI_NAME
              value: mbhome LLM
            - name: WEBUI_URL
              value: https://ai.apps.mbhome.biz
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: ENABLE_OAUTH_PERSISTENT_CONFIG
              value: "false"
            - name: OAUTH_PROVIDER_NAME
              value: Dex
            - name: OAUTH_CLIENT_ID
              value: open-webui
            - name: OPENID_PROVIDER_URL
              value: https://dex.apps.mbhome.biz/.well-known/openid-configuration
            - name: OPENID_REDIRECT_URI
              value: https://ai.apps.mbhome.biz/oauth/oidc/callback
            - name: OAUTH_SCOPES
              value: openid email profile groups
            - name: OAUTH_USERNAME_CLAIM
              value: preferred_username
            - name: OAUTH_EMAIL_CLAIM
              value: email
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "true"
            - name: OAUTH_ROLES_CLAIM
              value: groups
            - name: OAUTH_ALLOWED_ROLES
              value: open-webui-users,open-webui-admins
            - name: OAUTH_ADMIN_ROLES
              value: open-webui-admins
            - name: ENABLE_OAUTH_GROUP_MANAGEMENT
              value: "true"
            - name: OAUTH_GROUP_CLAIM
              value: groups
            - name: ENABLE_OAUTH_GROUP_CREATION
              value: "false"
            - name: OLLAMA_BASE_URL
              value: http://ollama.llm.svc.cluster.local:11434
            - name: RAG_EMBEDDING_ENGINE
              value: ollama
            - name: RAG_EMBEDDING_MODEL
              value: nomic-embed-text
            - name: ENABLE_VERSION_UPDATE_CHECK
              value: "false"
            - name: DO_NOT_TRACK
              value: "true"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui
                  key: WEBUI_SECRET_KEY
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui
                  key: OAUTH_CLIENT_SECRET
            - name: HF_TOKEN_PATH
              value: /var/run/secrets/huggingface/token
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: static-assets
              mountPath: /app/backend/open_webui/static
            - name: huggingface-token
              mountPath: /var/run/secrets/huggingface
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: static-assets
          emptyDir: {}
        - name: huggingface-token
          secret:
            secretName: open-webui
            optional: true
            items:
              - key: HF_TOKEN
                path: token
        - name: tmp
          emptyDir: {}
