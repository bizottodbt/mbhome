---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: finance-platform
  namespace: flux-system
  labels:
    app.kubernetes.io/name: finance-platform
    mbhome.biz/source: forgejo
spec:
  interval: 10m
  timeout: 5m
  prune: true
  wait: true
  suspend: true
  path: ./deploy/kubernetes/base
  targetNamespace: finance-platform
  sourceRef:
    kind: GitRepository
    name: finance-platform
  dependsOn:
    - name: apps
