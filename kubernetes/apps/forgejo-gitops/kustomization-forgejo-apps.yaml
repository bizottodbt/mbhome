---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-apps
  namespace: flux-system
  labels:
    app.kubernetes.io/name: forgejo-gitops
spec:
  interval: 10m
  timeout: 5m
  prune: true
  wait: true
  suspend: true
  path: ./clusters/mbhome
  sourceRef:
    kind: GitRepository
    name: forgejo-apps
  dependsOn:
    - name: apps
