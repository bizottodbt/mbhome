---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-album-sync
  namespace: immich-album-sync
  labels:
    app.kubernetes.io/name: immich-album-sync
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-album-sync
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: immich-album-sync
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - |
                  python /app/scripts/count-script.py
                  python /app/scripts/sync-script.py
              envFrom:
                - configMapRef:
                    name: immich-album-sync-settings
                - secretRef:
                    name: immich-album-sync
              volumeMounts:
                - name: scripts
                  mountPath: /app/scripts
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: scripts
              configMap:
                name: immich-album-sync-scripts
