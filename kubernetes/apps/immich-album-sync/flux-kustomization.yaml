---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-album-sync
  namespace: flux-system
  labels:
    app.kubernetes.io/name: immich-album-sync
    mbhome.biz/source: forgejo
spec:
  interval: 10m
  timeout: 5m
  prune: true
  wait: true
  suspend: false
  path: ./
  targetNamespace: immich-album-sync
  sourceRef:
    kind: GitRepository
    name: immich-album-sync
  dependsOn:
    - name: apps
