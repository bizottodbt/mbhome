---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      serviceAccountName: forgejo-runner
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docker
          image: docker:28-dind
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          args:
            - --host=tcp://127.0.0.1:2375
            - --host=unix:///var/run/docker.sock
            - --tls=false
            - --storage-driver=overlay2
          ports:
            - name: docker
              containerPort: 2375
              protocol: TCP
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
        - name: runner
          image: data.forgejo.org/forgejo/runner:12
          imagePullPolicy: IfNotPresent
          workingDir: /data
          env:
            - name: HOME
              value: /data
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
            - name: FORGEJO_RUNNER_UUID
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-registration
                  key: uuid
            - name: FORGEJO_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-registration
                  key: token
          command:
            - sh
            - -ec
            - |
              mkdir -p /data/cache /data/host-work /workspace
              cp /config/config.yaml /data/config.yaml
              cat >> /data/config.yaml <<EOF

              server:
                connections:
                  forgejo:
                    url: https://git.apps.mbhome.biz/
                    uuid: ${FORGEJO_RUNNER_UUID}
                    token: ${FORGEJO_RUNNER_TOKEN}
              EOF
              sleep 10
              exec forgejo-runner daemon --config /data/config.yaml
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - test -s /data/config.yaml
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: workspace
          emptyDir: {}
        - name: docker-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
