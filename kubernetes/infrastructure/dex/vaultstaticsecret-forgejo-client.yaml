---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: forgejo-client
  namespace: dex
  labels:
    app.kubernetes.io/name: dex
spec:
  type: kv-v2
  vaultAuthRef: default
  mount: mbhome
  path: apps/dex/forgejo
  refreshAfter: 5m
  hmacSecretData: true
  rolloutRestartTargets:
    - kind: Deployment
      name: dex
  destination:
    create: true
    name: dex-forgejo-client
    overwrite: true
