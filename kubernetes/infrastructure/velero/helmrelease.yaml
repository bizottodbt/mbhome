---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: flux-system
spec:
  interval: 30m
  releaseName: velero
  targetNamespace: velero
  chart:
    spec:
      chart: velero
      version: 12.1.0
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: velero

    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.13.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins

    credentials:
      useSecret: true
      existingSecret: velero-s3-credentials

    configuration:
      uploaderType: kopia
      defaultBackupTTL: 720h
      defaultVolumesToFsBackup: true
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: mbhome-kubernetes-backups
          prefix: mbhome
          default: true
          accessMode: ReadWrite
          credential:
            name: velero-s3-credentials
            key: cloud
          config:
            region: us-east-1
            s3ForcePathStyle: "true"
            s3Url: https://s3-backup.mbhome.biz
      volumeSnapshotLocation: []

    backupsEnabled: true
    snapshotsEnabled: false
    deployNodeAgent: true

    nodeAgent:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    schedules:
      daily-cluster:
        disabled: false
        schedule: "0 3 * * *"
        template:
          ttl: 720h
          storageLocation: default
          snapshotVolumes: false
          defaultVolumesToFsBackup: true
          includedNamespaces:
            - "*"
          excludedNamespaces:
            - velero

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      nodeAgentPodMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        spec:
          - alert: VeleroBackupFailed
            annotations:
              message: A scheduled Velero backup has failed.
            expr: velero_backup_last_status{schedule!=""} != 1
            for: 15m
            labels:
              severity: warning
          - alert: VeleroNoRecentSuccessfulBackup
            annotations:
              message: A Velero schedule has not completed successfully in the last 25 hours.
            expr: |
              (
                time() - velero_backup_last_successful_timestamp{schedule!=""}
              ) > 90000
            for: 1h
            labels:
              severity: warning
