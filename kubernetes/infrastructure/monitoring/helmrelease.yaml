---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 87.17.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: kube-prometheus-stack-operator
            patch: |
              - op: add
                path: /spec/template/spec/topologySpreadConstraints
                value:
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: ScheduleAnyway
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: prometheus-operator
                        app.kubernetes.io/instance: kube-prometheus-stack
                        app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  values:
    fullnameOverride: kube-prometheus-stack

    kubeProxy:
      enabled: false

    kubeEtcd:
      enabled: false

    defaultRules:
      rules:
        etcd: false
        kubeProxy: false

    prometheus-node-exporter:
      namespaceOverride: kube-system

    kube-state-metrics:
      podDisruptionBudget:
        maxUnavailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: kube-prometheus-stack
              app.kubernetes.io/name: kube-state-metrics

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      podDisruptionBudget:
        maxUnavailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: kube-prometheus-stack
              app.kubernetes.io/name: grafana
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          folderAnnotation: grafana_folder
          searchNamespace: ALL
      grafana.ini:
        server:
          root_url: https://grafana.apps.mbhome.biz
        auth:
          disable_login_form: false
        auth.generic_oauth:
          enabled: true
          name: Dex
          allow_sign_up: true
          client_id: grafana
          client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
          scopes: openid email profile groups offline_access
          auth_url: https://dex.apps.mbhome.biz/auth
          token_url: https://dex.apps.mbhome.biz/token
          api_url: https://dex.apps.mbhome.biz/userinfo
          login_attribute_path: preferred_username
          name_attribute_path: name
          email_attribute_path: email
          groups_attribute_path: groups
          role_attribute_path: >-
            contains(groups[*], 'grafana-admins') && 'GrafanaAdmin' ||
            contains(groups[*], 'grafana-editors') && 'Editor' ||
            contains(groups[*], 'grafana-viewers') && 'Viewer' ||
            contains(groups[*], 'k8s-admins') && 'GrafanaAdmin' ||
            contains(groups[*], 'k8s-viewers') && 'Viewer' ||
            ''
          role_attribute_strict: true
          allow_assign_grafana_admin: true
          use_refresh_token: true
      envFromSecret: grafana-oauth
      persistence:
        enabled: true
        type: sts
        storageClassName: nfs-cache
        accessModes:
          - ReadWriteOnce
        size: 5Gi

    prometheusOperator:
      podDisruptionBudget:
        enabled: true
        minAvailable: null
        maxUnavailable: 1

    prometheus:
      podDisruptionBudget:
        enabled: true
        minAvailable: null
        maxUnavailable: 1
      prometheusSpec:
        externalUrl: https://prometheus.apps.mbhome.biz
        retention: 15d
        retentionSize: 20GB
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorNamespaceSelector: {}
        ruleNamespaceSelector: {}
        probeNamespaceSelector: {}
        scrapeConfigNamespaceSelector: {}
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
                operator.prometheus.io/name: kube-prometheus-stack-prometheus
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-cache
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi

    alertmanager:
      podDisruptionBudget:
        enabled: true
        minAvailable: null
        maxUnavailable: 1
      alertmanagerSpec:
        externalUrl: https://alertmanager.apps.mbhome.biz
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                alertmanager: kube-prometheus-stack-alertmanager
                app.kubernetes.io/name: alertmanager
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-cache
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
