---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pvc-storage-accounting
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pvc-storage-accounting
    release: kube-prometheus-stack
spec:
  groups:
    - name: pvc.storage-accounting.rules
      rules:
        - record: namespace_persistentvolumeclaim:request_bytes
          expr: |
            max by (namespace, persistentvolumeclaim, storageclass) (
              kube_persistentvolumeclaim_resource_requests_storage_bytes
            )

        - record: storageclass:persistentvolumeclaim_requests:sum_bytes
          expr: |
            sum by (storageclass) (
              namespace_persistentvolumeclaim:request_bytes
            )

        - record: namespace_persistentvolumeclaim:nfs_backend_capacity_bytes
          expr: |
            max by (namespace, persistentvolumeclaim) (
              kubelet_volume_stats_capacity_bytes
            )

        - record: namespace_persistentvolumeclaim:nfs_backend_used_bytes
          expr: |
            max by (namespace, persistentvolumeclaim) (
              kubelet_volume_stats_used_bytes
            )

        - record: namespace_persistentvolumeclaim:nfs_backend_available_bytes
          expr: |
            max by (namespace, persistentvolumeclaim) (
              kubelet_volume_stats_available_bytes
            )
