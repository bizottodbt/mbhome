---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pvc-storage-accounting
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: pvc-storage-accounting-dashboard
  annotations:
    grafana_folder: mbhome
data:
  pvc-storage-accounting.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Declared PVC requests from kube-state-metrics. This is the useful per-PVC storage budget for NFS CSI subdirectory volumes.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "namespace_persistentvolumeclaim:request_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$persistentvolumeclaim\", storageclass=~\"$storageclass\"}",
              "format": "table",
              "instant": true,
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "PVC Requested Size",
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Total requested storage by StorageClass. With NFS CSI this is accounting, not enforced capacity.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "storageclass:persistentvolumeclaim_requests:sum_bytes{storageclass=~\"$storageclass\"}",
              "legendFormat": "{{storageclass}} requested",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Requested Storage By StorageClass",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Kubelet-reported used bytes for each mounted volume. For NFS CSI this normally reflects the backend export/filesystem usage, not the individual PVC subdirectory usage.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 3,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "namespace_persistentvolumeclaim:nfs_backend_used_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$persistentvolumeclaim\"}",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}} backend used",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "NFS Backend-Reported Used Bytes",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Capacity and available bytes as reported by kubelet for the NFS mount. These are backend/export values, not PVC hard limits.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 4,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "namespace_persistentvolumeclaim:nfs_backend_capacity_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$persistentvolumeclaim\"}",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}} backend capacity",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "namespace_persistentvolumeclaim:nfs_backend_available_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$persistentvolumeclaim\"}",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}} backend available",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "NFS Backend-Reported Capacity And Available Bytes",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": [
        "mbhome",
        "kubernetes",
        "storage",
        "pvc",
        "nfs"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "selected": false,
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "includeAll": false,
            "label": "Datasource",
            "multi": false,
            "name": "DS_PROMETHEUS",
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(namespace_persistentvolumeclaim:request_bytes, storageclass)",
            "hide": 0,
            "includeAll": true,
            "label": "StorageClass",
            "multi": true,
            "name": "storageclass",
            "query": {
              "query": "label_values(namespace_persistentvolumeclaim:request_bytes, storageclass)"
            },
            "refresh": 1,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(namespace_persistentvolumeclaim:request_bytes{storageclass=~\"$storageclass\"}, namespace)",
            "hide": 0,
            "includeAll": true,
            "label": "Namespace",
            "multi": true,
            "name": "namespace",
            "query": {
              "query": "label_values(namespace_persistentvolumeclaim:request_bytes{storageclass=~\"$storageclass\"}, namespace)"
            },
            "refresh": 1,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(namespace_persistentvolumeclaim:request_bytes{namespace=~\"$namespace\", storageclass=~\"$storageclass\"}, persistentvolumeclaim)",
            "hide": 0,
            "includeAll": true,
            "label": "PVC",
            "multi": true,
            "name": "persistentvolumeclaim",
            "query": {
              "query": "label_values(namespace_persistentvolumeclaim:request_bytes{namespace=~\"$namespace\", storageclass=~\"$storageclass\"}, persistentvolumeclaim)"
            },
            "refresh": 1,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "",
      "title": "Storage / PVC Accounting",
      "uid": "k8s-pvc-request-usage",
      "version": 1
    }
