# NOTE: this overrides Kolla's ironic-dnsmasq.conf template.
# Keep DHCP leases keyed by MAC address. PXE firmware, iPXE, and IPA can send
# different DHCP client identifiers for the same NIC; without this, dnsmasq may
# hand out a new address mid-deploy and Ironic will keep polling the stale IPA IP.
dhcp-ignore-clid
dhcp-authoritative

# DNS service is disabled; ironic-dnsmasq only serves provisioning DHCP/PXE.
port=0

interface=br-ex
bind-interfaces

dhcp-range=set:range_1,192.0.2.100,192.0.2.200,255.255.255.0,1h
dhcp-option=tag:range_1,option:router,192.0.2.10
dhcp-option=tag:range_1,option:ntp-server,192.0.2.10

dhcp-option=option:tftp-server,192.0.2.10
dhcp-option=option:server-ip-address,192.0.2.10
dhcp-option=210,/var/lib/ironic/tftpboot/
dhcp-match=ipxe,175
dhcp-match=set:efi,option:client-arch,7
dhcp-match=set:efi,option:client-arch,9

# Client is already running iPXE; move to next stage of chainloading.
dhcp-option=tag:ipxe,option:bootfile-name,http://192.0.2.10:8089/ipa.ipxe

# Client is PXE booting over EFI without iPXE ROM; send EFI iPXE chainloader.
dhcp-option=tag:efi,tag:!ipxe,option:bootfile-name,snponly.efi
dhcp-option=option:bootfile-name,undionly.kpxe

log-async
log-facility=/var/log/kolla/ironic/dnsmasq.log

dhcp-hostsdir=/etc/dnsmasq/dhcp-hostsdir
