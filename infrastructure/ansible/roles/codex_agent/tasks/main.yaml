---
- name: Install Codex agent sandbox dependencies
  ansible.builtin.apt:
    name:
      - bubblewrap
    state: present
    update_cache: true

- name: Create the Codex agent group
  ansible.builtin.group:
    name: "{{ codex_agent_group }}"
    system: true
    state: present

- name: Read the existing Codex agent account
  ansible.builtin.getent:
    database: passwd
    key: "{{ codex_agent_user }}"
    fail_key: false

- name: Stop Codex Remote before moving its home directory
  ansible.builtin.systemd_service:
    name: codex-agent-remote.service
    state: stopped
  when:
    - ansible_facts.getent_passwd[codex_agent_user] is not none
    - ansible_facts.getent_passwd[codex_agent_user][4] != codex_agent_home

- name: Stop stale Codex agent processes before moving its home directory
  ansible.builtin.command:
    argv:
      - pkill
      - -TERM
      - -u
      - "{{ codex_agent_user }}"
  register: _codex_agent_process_stop
  changed_when: _codex_agent_process_stop.rc == 0
  failed_when: _codex_agent_process_stop.rc not in [0, 1]
  when:
    - ansible_facts.getent_passwd[codex_agent_user] is not none
    - ansible_facts.getent_passwd[codex_agent_user][4] != codex_agent_home

- name: Wait for Codex agent processes to stop
  ansible.builtin.command:
    argv:
      - pgrep
      - -u
      - "{{ codex_agent_user }}"
  register: _codex_agent_process_check
  changed_when: false
  failed_when: _codex_agent_process_check.rc not in [0, 1]
  retries: 10
  delay: 1
  until: _codex_agent_process_check.rc == 1
  when:
    - ansible_facts.getent_passwd[codex_agent_user] is not none
    - ansible_facts.getent_passwd[codex_agent_user][4] != codex_agent_home

- name: Create the locked Codex agent account
  ansible.builtin.user:
    name: "{{ codex_agent_user }}"
    group: "{{ codex_agent_group }}"
    groups: ""
    append: false
    home: "{{ codex_agent_home }}"
    shell: /bin/bash
    system: true
    create_home: true
    move_home: true
    password_lock: true
    state: present

- name: Create private Codex agent directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ codex_agent_user }}"
    group: "{{ codex_agent_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ codex_agent_home }}"
      mode: "0700"
    - path: "{{ codex_agent_home }}/.codex"
      mode: "0700"
    - path: "{{ codex_agent_home }}/.ssh"
      mode: "0700"
    - path: "{{ codex_agent_workspace_root }}"
      mode: "0700"

- name: Create the legacy Codex workspace directory
  ansible.builtin.file:
    path: "{{ codex_agent_legacy_workspace_root }}"
    state: directory
    owner: "{{ codex_agent_user }}"
    group: "{{ codex_agent_group }}"
    mode: "0700"

- name: Repair the managed Codex daemon link after a home migration
  ansible.builtin.shell: |
    set -eu
    package_dir={{ (codex_agent_home ~ '/.codex/packages/app-server-daemon') | quote }}
    current="$package_dir/current"

    if [ -d "$package_dir/releases" ] && [ ! -x "$current/bin/codex" ]; then
      release="$(find "$package_dir/releases" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
      if [ -n "$release" ] && [ -x "$release/bin/codex" ]; then
        ln -sfn "$release" "$current"
        printf 'relinked\n'
      fi
    fi
  args:
    executable: /bin/bash
  become_user: "{{ codex_agent_user }}"
  register: _codex_agent_daemon_link
  changed_when: _codex_agent_daemon_link.stdout | length > 0

- name: Migrate projects into the Codex Remote project directory
  ansible.builtin.shell: |
    set -eu
    source_path={{ (codex_agent_legacy_workspace_root ~ '/' ~ item) | quote }}
    project_path={{ (codex_agent_workspace_root ~ '/' ~ item) | quote }}

    # A previous migration may have left the destination as a compatibility
    # link to the source. Remove that link before moving the repository back.
    if [ -L "$project_path" ] && [ "$(readlink -f "$project_path")" = "$(readlink -f "$source_path")" ]; then
      rm "$project_path"
    fi

    if [ -L "$source_path" ] && [ "$(readlink "$source_path")" != "$project_path" ]; then
      ln -sfn "$project_path" "$source_path"
      printf 'relinked\n'
    elif [ -d "$source_path" ] && [ ! -L "$source_path" ] && [ ! -e "$project_path" ]; then
      mv "$source_path" "$project_path"
      ln -s "$project_path" "$source_path"
      printf 'migrated\n'
    elif [ -d "$project_path" ] && [ ! -e "$source_path" ]; then
      ln -s "$project_path" "$source_path"
      printf 'linked\n'
    fi
  args:
    executable: /bin/bash
  become_user: "{{ codex_agent_user }}"
  register: _codex_agent_project_migration
  changed_when: _codex_agent_project_migration.stdout | length > 0
  loop: "{{ codex_agent_project_names }}"
  notify: Restart Codex Remote

- name: Inspect obsolete project links in the Codex session directory
  ansible.builtin.stat:
    path: "{{ codex_agent_home }}/Documents/Codex/{{ item }}"
    follow: false
  register: _codex_agent_obsolete_project_links
  loop: "{{ codex_agent_project_names }}"

- name: Remove obsolete project links from the Codex session directory
  ansible.builtin.file:
    path: "{{ codex_agent_home }}/Documents/Codex/{{ item.item }}"
    state: absent
  loop: "{{ _codex_agent_obsolete_project_links.results }}"
  when: item.stat.islnk | default(false)

- name: Configure the Codex agent Git identity
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ codex_agent_home }}/.gitconfig"
    owner: "{{ codex_agent_user }}"
    group: "{{ codex_agent_group }}"
    mode: "0600"

- name: Configure global Codex agent instructions
  ansible.builtin.template:
    src: AGENTS.md.j2
    dest: "{{ codex_agent_home }}/.codex/AGENTS.md"
    owner: "{{ codex_agent_user }}"
    group: "{{ codex_agent_group }}"
    mode: "0600"

- name: Configure Codex sandbox and approval behavior
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ codex_agent_home }}/.codex/config.toml"
    owner: "{{ codex_agent_user }}"
    group: "{{ codex_agent_group }}"
    mode: "0600"
  notify: Restart Codex Remote

- name: Install the Forgejo pull request helper
  ansible.builtin.template:
    src: forgejo-open-pr.j2
    dest: /usr/local/bin/forgejo-open-pr
    owner: root
    group: root
    mode: "0755"

- name: Check whether the Codex agent is authenticated
  ansible.builtin.stat:
    path: "{{ codex_agent_home }}/.codex/auth.json"
  register: _codex_agent_auth

- name: Install the Codex Remote systemd service
  ansible.builtin.template:
    src: codex-agent-remote.service.j2
    dest: /etc/systemd/system/codex-agent-remote.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Codex Remote

- name: Enable the Codex Remote systemd service
  ansible.builtin.systemd_service:
    name: codex-agent-remote.service
    enabled: true
    daemon_reload: true
    state: "{{ 'started' if _codex_agent_auth.stat.exists else 'stopped' }}"

- name: Ensure no agent sudoers policy exists
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ codex_agent_user }}"
    state: absent

- name: Read Codex agent group memberships
  ansible.builtin.command:
    argv:
      - id
      - -nG
      - "{{ codex_agent_user }}"
  register: _codex_agent_groups
  changed_when: false

- name: Assert the Codex agent has no privileged supplementary groups
  ansible.builtin.assert:
    that:
      - "'sudo' not in _codex_agent_groups.stdout.split()"
      - "'docker' not in _codex_agent_groups.stdout.split()"
      - "'libvirt' not in _codex_agent_groups.stdout.split()"
    fail_msg: >-
      {{ codex_agent_user }} unexpectedly belongs to a privileged group:
      {{ _codex_agent_groups.stdout }}
